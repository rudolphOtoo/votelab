; php-fpm for scripts/perf/lighthouse.sh. __RUN__ and __ENV_*__ are filled in by the script.
[global]
error_log = __RUN__/php-fpm.log
daemonize = no

[www]
listen = __RUN__/php-fpm.sock
pm = static
pm.max_children = 4
clear_env = no
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 0
