# Production-like local server for Lighthouse runs (scripts/perf/lighthouse.sh). Placeholders are filled in
# by the script: __ROOT__ (the export's public/), __RUN__ (scratch dir), __PORT__.
worker_processes 2;
error_log __RUN__/nginx-error.log warn;
pid __RUN__/nginx.pid;
daemon off;

events { worker_connections 256; }

http {
    include       __MIME__;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    client_body_temp_path __RUN__/tmp-body;
    fastcgi_temp_path     __RUN__/tmp-fastcgi;
    proxy_temp_path       __RUN__/tmp-proxy;
    uwsgi_temp_path       __RUN__/tmp-uwsgi;
    scgi_temp_path        __RUN__/tmp-scgi;

    # Compression: pre-compressed .gz for built assets, on-the-fly gzip for HTML/JSON. (Brotli would usually come
    # from the CDN in production; this nginx build has no Brotli module, so numbers here are slightly conservative.)
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml font/woff2;

    server {
        listen __PORT__ ssl;
        http2 on;
        server_name 127.0.0.1;
        ssl_certificate     __RUN__/cert.pem;
        ssl_certificate_key __RUN__/key.pem;
        root __ROOT__;
        index index.php;

        # Hashed build assets never change: cache for a year.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /storage/ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include __FASTCGI__;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_pass unix:__RUN__/php-fpm.sock;
        }
    }
}
